name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Validate shell installer syntax
        run: sh -n install.sh

  build-linux:
    name: Build Linux Artifact
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package artifact
        run: |
          mkdir -p dist/memx-linux-x86_64
          cp target/release/memx dist/memx-linux-x86_64/
          cp README.md LICENSE dist/memx-linux-x86_64/
          tar -C dist -czf memx-linux-x86_64.tar.gz memx-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memx-linux-x86_64
          path: memx-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Artifact
    runs-on: windows-2022
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\memx-windows-x86_64 | Out-Null
          Copy-Item target\release\memx.exe dist\memx-windows-x86_64\
          Copy-Item README.md, LICENSE dist\memx-windows-x86_64\
          Compress-Archive -Path dist\memx-windows-x86_64\* -DestinationPath memx-windows-x86_64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memx-windows-x86_64
          path: memx-windows-x86_64.zip

  build-macos:
    name: Build macOS Artifact
    runs-on: macos-14
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build arm64 release binary
        run: cargo build --locked --release

      - name: Build x86_64 release binary
        run: cargo build --locked --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist/memx-darwin-universal
          lipo -create \
            target/release/memx \
            target/x86_64-apple-darwin/release/memx \
            -output dist/memx-darwin-universal/memx
          cp README.md LICENSE dist/memx-darwin-universal/
          COPYFILE_DISABLE=1 tar -C dist -czf memx-darwin-universal.tar.gz memx-darwin-universal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memx-darwin-universal
          path: memx-darwin-universal.tar.gz

  publish-release:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs:
      - build-linux
      - build-windows
      - build-macos

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/memx-darwin-universal.tar.gz
            release/memx-linux-x86_64.tar.gz
            release/memx-windows-x86_64.zip
            release/checksums.txt
