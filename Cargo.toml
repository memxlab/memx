[package]
name = "memx"
version = "0.1.0"
edition = "2021"
default-run = "memx"

[dependencies]
# HTTP framework
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
libsql = "0.9.29"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (embedding)
reqwest = { version = "0.13.2", features = ["json"] }

# Memory allocator
mimalloc = { version = "0.1", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }
rpassword = "7"
semver = "1"

# Configuration
dotenvy = "0.15"
toml = "0.8"
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2.0.18"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
