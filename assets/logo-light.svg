        </linearGradient>
        <linearGradient id="accent" x1="758" y1="397" x2="971" y2="626" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF8457" />
            <stop offset="0.55" stop-color="#FF5A36" />
            <stop offset="1" stop-color="#FF3C1F" />
        </linearGradient>
        <linearGradient id="accentRing" x1="739" y1="382" x2="986" y2="638" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF8F67" stop-opacity="0.08" />
            <stop offset="0.45" stop-color="#FF734D" stop-opacity="0.28" />
            <stop offset="1" stop-color="#FF734D" stop-opacity="0.08" />
        </linearGradient>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
