        </filter>
        <filter id="panelShadow" x="24" y="204" width="976" height="620" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#8A7667" flood-opacity="0.18" />
        </filter>
        <filter id="panelBlur" x="44" y="222" width="936" height="580" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="10" />
        </filter>
        <filter id="wordShadow" x="11" y="351" width="1000" height="331" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.32" />
        </filter>
        <filter id="accentGlow" x="681" y="321" width="366" height="382" filterUnits="userSpaceOnUse">
