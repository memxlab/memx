    <title>MemX Logo Light</title>
    <defs>
        <linearGradient id="bg" x1="116" y1="88" x2="912" y2="936" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FCFBF8" />
            <stop offset="0.52" stop-color="#F4F1EB" />
            <stop offset="1" stop-color="#ECE7DF" />
        </linearGradient>
        <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 320) rotate(128) scale(328 286)">
            <stop offset="0" stop-color="#FF8A61" stop-opacity="0.22" />
            <stop offset="0.46" stop-color="#FF8A61" stop-opacity="0.08" />
            <stop offset="1" stop-color="#FF8A61" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="coolGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(222 206) rotate(36) scale(252 222)">
            <stop offset="0" stop-color="#82C8FF" stop-opacity="0.22" />
            <stop offset="0.45" stop-color="#82C8FF" stop-opacity="0.08" />
            <stop offset="1" stop-color="#82C8FF" stop-opacity="0" />
        </radialGradient>
